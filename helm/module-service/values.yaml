nameOverride: ""
fullnameOverride: ""

image:
  repository: nicksohl/module-service
  tag: main
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080

# module_service is scaled vertically per the task; no HPA. Requests/limits
# are sized for stable operation under the k6 load test.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 768Mi

strategy:
  maxSurge: 0
  maxUnavailable: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  path: /health
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 20

# Aufgabe 6 – Managed MySQL. Placeholders; feed from terraform output at deploy time.
database:
  # SQLAlchemy URL, e.g. mysql+pymysql://user:pass@host:3306/db
  url: "mysql+pymysql://module_service_app:REPLACE_ME@127.0.0.1:3306/module_service"
  # DO Managed MySQL requires TLS; PyMySQL is happy with server-verified TLS when SSL is enabled.
  sslDisabled: false

app:
  logLevel: INFO
  version: "0.1.0"

monitoring:
  enabled: true
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: monitoring
