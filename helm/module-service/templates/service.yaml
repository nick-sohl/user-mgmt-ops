apiVersion: v1
kind: Service
metadata:
  name: {{ include "module-service.fullname" . }}
  labels:
    {{- include "module-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "module-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
