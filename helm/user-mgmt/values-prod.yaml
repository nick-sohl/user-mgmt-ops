# Production environment overrides.
# Applied on top of values.yaml.

# Replicas dropped to 2 to fit the single-node DO cluster alongside staging.
# Task 6 will add an HPA that scales up as needed.
backend:
  replicaCount: 2

frontend:
  replicaCount: 2

# Prod postgres uses ~50-100 MiB at rest; smaller request lets it fit the node
# alongside staging on the single-node DO cluster.
postgres:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi

networkPolicy:
  enabled: true
