nameOverride: ""
fullnameOverride: ""

backend:
  image:
    repository: nicksohl/user-management-service
    tag: sha-01fac1c
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    port: 8080
  config:
    springJpaHibernateDdlAuto: update
    jwtIssuer: Spring
    jwtExpirationMillis: "86400000"
  secrets:
    jwtSecret: "d0lEQVFBQkFrQXpHbEZBUkZhdTdLMGI5RmNFd0lEQVFBQkFrQXpHbEZBUkZhdTdLMGI5RmNFd0lEQVFBQkFrQXpHbEZBUkZhdTdLMGI5RmNF"
    letsencryptEmail: "stefan.furrer@edu.teko.ch"
  probes:
    enabled: true
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 90
      periodSeconds: 20
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

frontend:
  image:
    repository: nicksohl/user-management-frontend
    tag: sha-01fac1c
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    port: 3000
  config:
    nextPublicApiUrl: https://user-mgmt-service.duckdns.org/backend
  probes:
    enabled: true
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

postgres:
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
  db:
    name: postgres
  secrets:
    user: "postgres"
    password: "postgres"
  storage:
    size: 5Gi
    accessMode: ReadWriteOncePod
    pgDataSubPath: pgdata
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: user-mgmt-service.duckdns.org
  backendPath: /backend
  tls:
    enabled: true
    secretName: user-mgmt-tls

certManager:
  clusterIssuer:
    # Whether this release manages (creates) the ClusterIssuer resource.
    # Only one release should own it since it is cluster-scoped.
    create: true
    # Name referenced by every Ingress via the cert-manager annotation.
    name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    email: stefan.furrer@edu.teko.ch

# Environment isolation — opt-in per env values file
resourceQuota:
  enabled: false
  hard: {}

networkPolicy:
  enabled: false
  # Namespaces whose pods are allowed to send ingress traffic (in addition to the
  # same namespace itself). Referenced by the well-known label kubernetes.io/metadata.name.
  allowedFromNamespaces:
    - ingress-nginx
