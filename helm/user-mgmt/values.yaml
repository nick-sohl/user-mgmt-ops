nameOverride: ""
fullnameOverride: ""

backend:
  image:
    repository: nicksohl/user-management-service
    tag: sha-01fac1c
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    port: 8080
  config:
    springJpaHibernateDdlAuto: update
    jwtIssuer: Spring
    jwtExpirationMillis: "86400000"
  secrets:
    jwtSecret: "d0lEQVFBQkFrQXpHbEZBUkZhdTdLMGI5RmNFd0lEQVFBQkFrQXpHbEZBUkZhdTdLMGI5RmNFd0lEQVFBQkFrQXpHbEZBUkZhdTdLMGI5RmNF"
    letsencryptEmail: "stefan.furrer@edu.teko.ch"
  probes:
    enabled: true
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 90
      periodSeconds: 20
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  strategy:
    # maxSurge 0 works on a tight single-node cluster (avoids surge overcommit).
    maxSurge: 0
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Aufgabe 1 – Observability: emits ServiceMonitor + PrometheusRule for the backend.
  # Requires the kube-prometheus-stack (see helm/monitoring/) to be installed in the cluster.
  monitoring:
    enabled: true
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    # Label picked up by kube-prometheus-stack's Prometheus ruleSelector/serviceMonitorSelector.
    additionalLabels:
      release: monitoring
  # Aufgabe 4 – Managed PostgreSQL. Values here are placeholders; the real
  # host/password come from the Terraform outputs in user-mgmt-ops/terraform/
  # (see terraform/README.md → "Feeding the Helm chart").
  #
  # Provide them at deploy time via `--set-string` or a sealed/external secret,
  # never hardcode credentials into a values file that gets committed.
  database:
    host: postgres-do-user-0000000-0.b.db.ondigitalocean.com
    port: 25060
    name: user_mgmt
    sslMode: require
    username: user_mgmt_app
    password: "REPLACE_ME"

frontend:
  image:
    repository: nicksohl/user-management-frontend
    tag: sha-01fac1c
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    port: 3000
  config:
    nextPublicApiUrl: https://user-mgmt-service.duckdns.org/backend
  probes:
    enabled: true
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  strategy:
    maxSurge: 0
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

ingress:
  enabled: true
  className: nginx
  host: user-mgmt-service.duckdns.org
  backendPath: /backend
  tls:
    enabled: true
    secretName: user-mgmt-tls

certManager:
  clusterIssuer:
    # Whether this release manages (creates) the ClusterIssuer resource.
    # Only one release should own it since it is cluster-scoped.
    create: true
    # Name referenced by every Ingress via the cert-manager annotation.
    name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    email: stefan.furrer@edu.teko.ch

# Environment isolation — opt-in per env values file
resourceQuota:
  enabled: false
  hard: {}

networkPolicy:
  enabled: false
  # Namespaces whose pods are allowed to send ingress traffic (in addition to the
  # same namespace itself). Referenced by the well-known label kubernetes.io/metadata.name.
  allowedFromNamespaces:
    - ingress-nginx
