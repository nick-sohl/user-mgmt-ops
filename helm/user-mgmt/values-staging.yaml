# Staging environment overrides.
# Applied on top of values.yaml.

backend:
  replicaCount: 1
  # ResourceQuota only has room for the base pods; no scaling headroom.
  autoscaling:
    enabled: false
  # Single-replica staging cannot honour a PDB, so disable it.
  podDisruptionBudget:
    enabled: false

frontend:
  replicaCount: 1
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  config:
    nextPublicApiUrl: https://user-mgmt-service-staging.duckdns.org/backend

postgres:
  podDisruptionBudget:
    enabled: false

ingress:
  host: user-mgmt-service-staging.duckdns.org
  tls:
    secretName: user-mgmt-staging-tls

certManager:
  clusterIssuer:
    # Prod owns the ClusterIssuer; staging only references it.
    create: false

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "500m"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 4Gi

networkPolicy:
  enabled: true
