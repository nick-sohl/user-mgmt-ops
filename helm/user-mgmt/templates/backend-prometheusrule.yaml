{{- if .Values.backend.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "user-mgmt.backend.name" . }}
  labels:
    {{- include "user-mgmt.backend.labels" . | nindent 4 }}
    {{- with .Values.backend.monitoring.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: user-mgmt-backend.rules
      rules:
        - alert: UserMgmtHighErrorRate
          expr: |
            sum by (namespace, service) (
              rate(http_server_requests_seconds_count{application="user-mgmt-service",status=~"5.."}[5m])
            )
            /
            sum by (namespace, service) (
              rate(http_server_requests_seconds_count{application="user-mgmt-service"}[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: user-mgmt-service
          annotations:
            summary: "user-mgmt-service has elevated 5xx error rate"
            description: |
              More than 5% of HTTP requests to user-mgmt-service have returned a 5xx status
              over the last 5 minutes (namespace {{`{{ $labels.namespace }}`}}).
        - alert: UserMgmtHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, namespace, service) (
                rate(http_server_requests_seconds_bucket{application="user-mgmt-service"}[5m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
            service: user-mgmt-service
          annotations:
            summary: "user-mgmt-service p95 latency above 1s"
            description: |
              95th percentile HTTP request latency has exceeded 1s for 10 minutes
              (namespace {{`{{ $labels.namespace }}`}}).
        - alert: UserMgmtPodDown
          expr: |
            absent(up{job=~".*user-mgmt.*backend.*"} == 1)
          for: 5m
          labels:
            severity: critical
            service: user-mgmt-service
          annotations:
            summary: "user-mgmt-service backend has no healthy pod"
            description: "No user-mgmt backend pod has been reachable by Prometheus for 5 minutes."
{{- end }}
