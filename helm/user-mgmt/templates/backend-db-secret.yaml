{{- /*
Kubernetes Secret carrying the DigitalOcean Managed PostgreSQL credentials.
Values are placeholders in values.yaml — inject the real ones from Terraform
outputs at deploy time, e.g.:

  helm upgrade user-mgmt-prod ./helm/user-mgmt \
    --set-string backend.database.host=$(terraform output -raw postgres_host) \
    --set-string backend.database.password=$(terraform output -raw postgres_password) ...

In prod prefer external-secrets / sealed-secrets over --set-string.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "user-mgmt.backend.dbSecretName" . }}
  labels:
    {{- include "user-mgmt.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.backend.database.username | quote }}
  password: {{ .Values.backend.database.password | quote }}
  jdbc-url: {{ include "user-mgmt.backend.jdbcUrl" . | quote }}
