apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU + memory requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container in a Pod must declare CPU + memory `requests` and `limits`.
      Guards the ResourceQuota (user-mgmt-prod) and the HPA (needs requests to
      compute CPU utilisation).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: containers-must-have-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - policy
                - argocd
                - monitoring
                - loadtest
      validate:
        message: >-
          Every container must set resources.requests.cpu, resources.requests.memory,
          resources.limits.cpu and resources.limits.memory.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
