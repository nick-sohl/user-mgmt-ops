apiVersion: batch/v1
kind: Job
metadata:
  name: k6-user-mgmt-load
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/component: loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/component: loadtest
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.53.0
          args:
            - run
            - --summary-trend-stats=avg,min,med,p(95),p(99),max
            - /scripts/user-mgmt-load.js
          env:
            # Override with the target release you are stressing.
            - name: TARGET_BASE_URL
              value: http://user-mgmt-prod-user-mgmt-backend.user-mgmt-prod.svc.cluster.local:8080
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
