apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nick-sohl/user-mgmt-ops.git
    targetRevision: main
    path: helm/policy
    helm:
      releaseName: policy
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
